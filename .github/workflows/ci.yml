name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test, Build & Security Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Formatting & Linting
        run: |
          npm run format:check
          npm run lint

      - name: Apply Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillvault_test?schema=public
        run: npx prisma migrate deploy

      - name: Run Test Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillvault_test?schema=public
          BETTER_AUTH_SECRET: skillvault_ci_test_secret_32_chars_minimum_example
          STORAGE_DRIVER: local
          REQUIRE_EMAIL_VERIFICATION: 'false'
        run: npm run test

      - name: Production Build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillvault_test?schema=public
          BETTER_AUTH_SECRET: skillvault_ci_test_secret_32_chars_minimum_example
          STORAGE_DRIVER: s3
          S3_BUCKET: skillvault-blobs
        run: npm run build

      - name: Security Audit (Fail on High/Critical)
        run: npm audit --omit=dev --audit-level=high
