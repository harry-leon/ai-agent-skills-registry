services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillvault-app
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - APP_URL=${APP_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/skillvault?schema=public
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-skillvault_production_secret_32chars_minimum_example}
      - STORAGE_DRIVER=s3
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=skillvault-blobs
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_FORCE_PATH_STYLE=true
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:18-alpine
    container_name: skillvault-db
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=skillvault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d skillvault']
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:18-alpine
    container_name: skillvault-db-test
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=skillvault_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d skillvault_test']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: skillvault-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-41-28Z
    container_name: skillvault-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/skillvault-blobs;
      /usr/bin/mc anonymous set none myminio/skillvault-blobs;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
